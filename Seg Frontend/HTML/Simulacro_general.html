<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simulacro de Examen - Vertical</title>
  <link rel="stylesheet" href="/Seg Frontend/CSS/Simulacro_general.css">
  <!-- Fuentes e íconos -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <div class="container">
    
    <!-- Encabezado -->
    <header class="app-header">
      <div class="brand">
        <i class="fa-solid fa-graduation-cap brand-icon"></i>
        <h1>Simulacro General 1</h1>
      </div>
      <div class="timer-box">
        <i class="fa-regular fa-clock"></i>
        <span id="timer">00:00</span>
      </div>
    </header>

    <!-- Barra de progreso global -->
    <div class="progress-container">
      <div class="progress-info">
        <span id="progress-text">Respondidas: 0 de 3</span>
        <span id="score-live">Aciertos: 0</span>
      </div>
      <div class="progress-bar">
        <div id="progress-fill" class="progress-fill" style="width: 0%;"></div>
      </div>
    </div>

    <!-- Contenedor donde se listan todas las preguntas hacia abajo -->
    <main class="questions-scroll-container" id="questions-scroll-container">
      <!-- Generado dinámicamente por JS -->
    </main>

    <!-- Sección de botón final -->
    <div class="finish-section" id="finish-section">
      <button id="finish-btn" class="btn btn-primary btn-large">
        <i class="fa-solid fa-flag-checkered"></i> Ver Resultados Finales
      </button>
     
    </div>

    <!-- Pantalla de Resultados (Oculta por defecto) -->
    <div id="results-screen" class="results-card hidden">
      <i class="fa-solid fa-trophy trophy-icon"></i>
      <h2>¡Simulacro Completado!</h2>
      <div class="stats-grid">
        <div class="stat-item">
          <span class="stat-value" id="final-score">0 / 3</span>
          <span class="stat-label">Puntaje Final</span>
        </div>
        <div class="stat-item">
          <span class="stat-value" id="final-percentage">0%</span>
          <span class="stat-label">Efectividad</span>
        </div>
        <div class="stat-item">
          <span class="stat-value" id="final-time">00:00</span>
          <span class="stat-label">Tiempo Total</span>
        </div>
      </div>
      <button id="restart-btn" class="btn btn-primary btn-large-1">
        <i class="fa-solid fa-rotate-right"></i> Reiniciar Simulacro
      </button>
      <a href="/Frontend/HTML/Simulacros.html"> <button class="btn btn-primary btn-salir">🠔 Jeonn ICFES</button></a>
    </div>
  </div>

  <div class="container-footer">
      <footer class="footer-mced">
            
            <div class="footer-left">
              <h3>Jeonn Icfes</h3>
            </div>

            <div class="footer-center">
              <nav class="footer-links">
                <a href="/Frontend/HTML/Nosotros.html">Acerca de Jeonn</a>
              </nav>
              <p>© Desde 2025 hasta 2026 <strong>Jeonn</strong>. Persevera y alcanzaras.</p>
            </div>
            <div class="footer-social">
                  <a href="https://instagram.com" target="_blank" aria-label="Instagram">
                    <i class=""></i>
                  <img src="/IMG/icons8-instagram-96.png" alt="" width="50px" height="50px"></a>
                  <a href="https://facebook.com" target="_blank" aria-label="Facebook">
                    <i class=""></i>
                    <img src="/IMG/icons8-facebook-96.png" alt="" width="50px" height="50px">
                  </a>
                  <a href="https://x.com" target="_blank" aria-label="x">
                    <i class=""></i>
                    <img src="/IMG/icons8-x-96.png" alt=""width="50px" height="50px">
                  </a>
                </div>
        <p>Email: Jeonn_Icfes@gmail.com</p>
      </footer>
  </div>

  

  <script src="/Seg Frontend/JS/Simulacro_general.js"></script>
</body>
</html>
