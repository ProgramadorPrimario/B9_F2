    <!DOCTYPE html>
    <html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Simulacro ICFES Saber 11°</title>
        <link rel="stylesheet" href="/Seg Frontend/CSS/body.css">
        <link rel="stylesheet" href="/Seg Frontend/CSS/Simulacro_general_2.css">
    </head>
    <body class="boby-simulacros">

        <header class="main-header">
            <h1>Simulacro ICFES Saber 11°</h1>
            <p>Prueba interactiva de 70 preguntas</p>
        </header>

        <main class="container">
            <!-- Panel de control e información -->
            <section class="quiz-controls">
                <div class="filter-group">
                    <label for="area-filter"><strong>Filtrar por Área:</strong></label>
                    <select id="area-filter">
                        <option value="ALL">Todas las Áreas (70 Preguntas)</option>
                        <option value="Matemáticas">1. Matemáticas</option>
                        <option value="Ciencias Naturales">2. Ciencias Naturales</option>
                        <option value="Lectura Crítica">3. Lectura Crítica</option>
                        <option value="Sociales y Ciudadanas">4. Sociales y Ciudadanas</option>
                        <option value="Inglés">5. Inglés</option>
                    </select>
                </div>
                <button id="reset-btn" class="btn secondary">Reiniciar Prueba</button>
                <a href="/Frontend/HTML/Simulacros.html" id="reset-btn" class="btn-secondary"><img src="/IMG/icons8-izquierda-círculo-96.png" alt=""></a>
            </section>

            <!-- Contenedor dinámico de preguntas -->
            <section id="questions-container"></section>

            <!-- Botón para calificar -->
            <div class="action-area">
                <button id="submit-btn" class="btn primary">Finalizar y Calificar</button>
            </div>

            <!-- Resultados -->
            <section id="results-card" class="results-card hidden">
                <h2>Resultados del Simulacro</h2>
                <div class="score-display">
                    <span id="score-text">0 / 70</span>
                    <span id="percentage-text">0%</span>
                </div>
                <p id="feedback-message"></p>
            </section>
        </main>

        <footer class="footer-mced">
        
  <div class="footer-left">
    <h3>Jeonn Icfes</h3>
  </div>

  <div class="footer-center">
    <nav class="footer-links">
      <a href="/Frontend/HTML/Nosotros.html">Acerca de Jeonn</a>
    </nav>
    <p>© Desde 2025 hasta 2026 <strong>Jeonn</strong>. Persevera y alcanzaras.</p>
  </div>
  <div class="footer-social">
        <a href="https://instagram.com" target="_blank" aria-label="Instagram">
          <i class="fab fa-instagram"></i>
        <img src="/IMG/icons8-instagram-96.png" alt="" width="50px" height="50px"></a>
        <a href="https://facebook.com" target="_blank" aria-label="Facebook">
          <i class="fab fa-facebook-f"></i>
          <img src="/IMG/icons8-facebook-96.png" alt="" width="50px" height="50px">
        </a>
        <a href="https://x.com" target="_blank" aria-label="x">
          <i class="fab fa-x"></i>
          <img src="/IMG/icons8-x-96.png" alt=""width="50px" height="50px">
        </a>
      </div>
    <p>Email: Jeonn_Icfes@gmail.com</p>
</footer>

        <script src="/Seg Frontend/JS/Simulacro_general_2.js"></script>
    </body>
    </html>
