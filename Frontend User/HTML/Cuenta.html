<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Jeonn ICFES | Cuenta</title>
    <link rel="stylesheet" href="/Frontend User/Style.css">
    <link rel="stylesheet" href="/Frontend User/CSS/Cuenta.css">
</head>
<body>
    <section class="user">
        <h1>Name User</h1>
        <p class="p-1">@User </p>
        <div class="imagen-user"><img src="/IMG/icons8-diploma-60 1.png" alt="" class="diploma"></div>
        <div class="Nivel-ICFES"><h3 class="p-2">Nivel ICFES:</h3></div>
    </section>

    <header>
        <nav class="nav-bar">
            <ul class="nav-link">
                <li ><a href="/Frontend User/HTML/Hub.html" >Perfil</a></li>
                <li><a href="/Frontend User/HTML/Cuenta.html"class="active">Cuenta</a></li>
                <li><a href="/Frontend User/HTML/Preferencias.html">Preferencias</a></li>
                <li><a href="/Frontend User/HTML/Estadistica.html">Estadisticas</a></li>
                <li><a href="/Frontend/HTML/Inicio.html">Inicio</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section class="Introduccion">
        <h2 class="p-3">Hola, [Usuario]</h2>
    </section>
    <section class="section">
        <div class="parte_amarilla">
            <div class="parte_blanca"> <h4 class="p-4">Estado de perfil: Publico</h4></div>
            <button class="btn_morado">Cambiar</button>
        </div>
      <section class="parte-morada">
      <form class="form">
        <div class="campo-1">
            <label for="nombre_usuario">Nombre de usuario<span>*</span></label>
            <input type="text" id="nombre_usuario" name="nombre_usuario">
        </div>

        <div class="campo-2">
            <label for="nombre_completo">Nombre completo<span>*</span></label>
            <input type="text" id="nombre_completo" name="nombre_completo">
        </div>

        <div class="campo-1">
            <label for="email">Correo Electrónico<span>*</span></label>
            <input type="email" id="email" name="email">
        </div>

        <div class="campo-2">
            <label for="telefono">Numero de teléfono<span>*</span></label>
            <input type="tel" id="telefono" name="telefono">
        </div>

        <div class="campo-1">
            <label for="idioma">Idioma preferido<span>*</span></label>
            <select id="idioma" name="idioma">
                <option value="" disabled selected>Selecciona un idioma</option>
                <option value="es">Español</option>
                <option value="en">Inglés</option>
                <option value="fr">Francés</option>
                <option value="pt">Portugués</option>
            </select>
        </div>
        <div class="campo-2">
            <label for="lugar">Departamento, ciudad<span>*</span></label>
            <input type="text" id="lugar" name="lugar">
        </div>

      </form>
      </section>
      
    </section>
  </main>   
</body>
</html>
